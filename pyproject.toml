[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "elims-instruments"
version = "0.1.0"
description = "Communication drivers and bench configuration for ELIMS instruments."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

dependencies = [
  "loguru>=0.7.3",
  "pydantic>=2",
  "pyvisa>=1.14",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2",
  "sqlmodel>=0.0.39",
  "toml>=0.10",
  "typer>=0.27.1",
  "typing-extensions>=4.12",
]

[project.scripts]
elims = "elims_instruments.cli:app"
instruments = "elims_instruments.cli.instruments:app"

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "ruff>=0.4",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "types-pyyaml>=6.0.12.20260724",
]

# ---------------------------------------------------------------------------
# Hatch (build)
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["elims_instruments"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["elims_instruments", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle errors/warnings
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # flake8-bugbear
  "C4",       # flake8-comprehensions
  "SIM",      # flake8-simplify
  "TCH",      # flake8-type-checking (move pure-type imports to TYPE_CHECKING)
  "ANN",      # flake8-annotations
  "PTH",      # flake8-use-pathlib
  "RUF",      # ruff-specific rules
]
ignore = [
  "ANN101",  # missing type for `self`
  "ANN102",  # missing type for `cls`
]

[tool.ruff.lint.isort]
known-first-party = ["elims_instruments"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # relax annotations in test files

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
files = ["elims_instruments"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--tb=short",
  "--basetemp=.pytest-tmp",
  "-q",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests requiring external services",
]

[tool.coverage.run]
source = ["elims_instruments"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]
